[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

# SPA fallback. Functions declare their own /api/* paths (via config.path) and
# are matched before this catch-all.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
